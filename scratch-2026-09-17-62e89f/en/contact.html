<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us — SEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <h1>Report an issue</h1>
  <p class="confidential-note">This form is <strong>confidential</strong>: your answers are never published, they come straight to us by email so the Board can reply to you.</p>

  <form class="sec-form" id="contact-form" action="https://formspree.io/f/REPLACE_ME" method="POST">
    <div class="field">
      <label for="c-name">First and last name</label>
      <input id="c-name" name="name" type="text" required>
    </div>
    <div class="field">
      <label for="c-email">Email</label>
      <input id="c-email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="c-category">Topic (optional)</label>
      <select id="c-category" name="category">
        <option value="">Doesn't matter, tell us anything</option>
        <option value="academics">Academics</option>
        <option value="administration">Administration</option>
        <option value="campus-life">Campus / student life</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="field">
      <label for="c-message">Your message</label>
      <textarea id="c-message" name="message" rows="6" required></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Send</button>
    <div class="form-status" id="contact-form-status"></div>
  </form>
</main>

<footer id="site-footer" class="site-footer"></footer>
<script src="/assets/js/i18n-strings.js"></script>
<script src="/assets/js/partials.js"></script>
<script src="/assets/js/contact.js"></script>
</body>
</html>
