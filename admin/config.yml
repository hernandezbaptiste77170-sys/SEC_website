# Decap CMS configuration. See https://decapcms.org/docs/intro/
#
# REQUIRED before this works: replace REPLACE_ME/REPLACE_ME below with your real
# "github-username/repo-name" once the site is pushed to GitHub, and set up the
# OAuth step described in README.md ("Setting up the no-code editor").
backend:
  name: github
  repo: REPLACE_ME/REPLACE_ME
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "blog"
    label: "Blog"
    files:
      - file: "content/blog.json"
        label: "Billets de blog / Blog posts"
        name: "posts_file"
        fields:
          - label: "Billets / Posts"
            name: "posts"
            widget: "list"
            summary: "{{title_fr}} ({{date}})"
            fields:
              - { label: "Identifiant (slug, sans espace ni accent)", name: "slug", widget: "string" }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Titre (FR)", name: "title_fr", widget: "string", required: true }
              - { label: "Extrait (FR)", name: "excerpt_fr", widget: "text", required: true }
              - { label: "Contenu (FR)", name: "body_fr", widget: "markdown", required: true }
              - { label: "Title (EN)", name: "title_en", widget: "string", required: true }
              - { label: "Excerpt (EN)", name: "excerpt_en", widget: "text", required: true }
              - { label: "Body (EN)", name: "body_en", widget: "markdown", required: true }

  - name: "petitions"
    label: "Pétitions / Petitions"
    files:
      - file: "content/petitions.json"
        label: "Pétitions / Petitions"
        name: "petitions_file"
        fields:
          - label: "Pétitions / Petitions"
            name: "petitions"
            widget: "list"
            summary: "{{title_fr}} ({{status}})"
            fields:
              - { label: "Identifiant (slug, sans espace ni accent)", name: "slug", widget: "string" }
              - label: "Statut / Status"
                name: "status"
                widget: "select"
                options: ["open", "closed"]
                default: "open"
              - { label: "Titre (FR)", name: "title_fr", widget: "string", required: true }
              - { label: "Description (FR)", name: "description_fr", widget: "text", required: true }
              - { label: "Title (EN)", name: "title_en", widget: "string", required: true }
              - { label: "Description (EN)", name: "description_en", widget: "text", required: true }
              - label: "Lien du formulaire Google (action URL)"
                name: "google_form_action"
                widget: "string"
                required: false
                hint: "Voir README.md « Configurer une pétition »"
              - { label: "Nom du champ e-mail du formulaire (entry.XXXXX)", name: "entry_email", widget: "string", required: false }
              - { label: "Nom du champ nom du formulaire (entry.XXXXX)", name: "entry_name", widget: "string", required: false }
              - { label: "Nom du champ anonymat du formulaire (entry.XXXXX)", name: "entry_anonymous", widget: "string", required: false }
              - label: "Lien CSV publié de la feuille de calcul"
                name: "sheet_csv_url"
                widget: "string"
                required: false
                hint: "Fichier > Partager > Publier sur le web > format CSV"

  - name: "members"
    label: "Membres / Members"
    files:
      - file: "content/members.json"
        label: "Membres / Members"
        name: "members_file"
        fields:
          - label: "Membres / Members"
            name: "members"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Prénom et nom / Full name", name: "name", widget: "string", required: true }
              - { label: "Photo", name: "photo", widget: "image", required: false }
