<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nous contacter — SEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <h1>Faire remonter un problème</h1>
  <p class="confidential-note">Ce formulaire est <strong>confidentiel</strong> : vos réponses ne sont jamais publiées, elles nous arrivent directement par e-mail pour que le Bureau puisse vous répondre.</p>

  <form class="sec-form" id="contact-form" action="https://formspree.io/f/mbgljzpr" method="POST">
    <div class="field">
      <label for="c-name">Prénom et nom</label>
      <input id="c-name" name="name" type="text" required>
    </div>
    <div class="field">
      <label for="c-email">Email</label>
      <input id="c-email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="c-category">Sujet (facultatif)</label>
      <select id="c-category" name="category">
        <option value="">Peu importe, dites-nous tout</option>
        <option value="academique">Vie académique</option>
        <option value="administration">Administration</option>
        <option value="vie-associative">Vie associative / campus</option>
        <option value="autre">Autre</option>
      </select>
    </div>
    <div class="field">
      <label for="c-message">Votre message</label>
      <textarea id="c-message" name="message" rows="6" required></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Envoyer</button>
    <div class="form-status" id="contact-form-status"></div>
  </form>
</main>

<footer id="site-footer" class="site-footer"></footer>
<script src="../assets/js/i18n-strings.js"></script>
<script src="../assets/js/partials.js"></script>
<script src="../assets/js/contact.js"></script>
</body>
</html>
